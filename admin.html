<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin | N Luxury Design</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="loginView" class="login-screen">
  <div class="login-card">
    <h1>N Luxury Design</h1>
    <p>Sign in to the admin panel</p>
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" class="btn-primary">Sign in</button>
    <div id="loginError" class="error-text"></div>
  </div>
</div>

<div id="appView" class="admin-app" hidden>
  <header class="admin-header">
    <div class="admin-header-inner">
      <span class="admin-brand">N Luxury Design · Admin</span>
      <div class="admin-header-actions">
        <a href="index.html" target="_blank" class="link-btn">View shop ↗</a>
        <button id="logoutBtn" class="link-btn">Sign out</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <section class="panel">
      <div class="panel-head">
        <h2>Collections</h2>
      </div>

      <form id="collectionForm" class="quick-form">
        <h3>New collection</h3>
        <input type="text" id="cName" placeholder="Collection name (e.g. Spring-Summer 2026)" required>
        <input type="text" id="cSeason" placeholder="Season (optional, e.g. SS26)">
        <textarea id="cDescription" placeholder="Short description (optional)" rows="2"></textarea>
        <button type="submit" class="btn-primary">Add collection</button>
        <div id="collectionFormStatus" class="status-text"></div>
      </form>

      <div id="collectionsTable"></div>
    </section>

    <section class="panel" id="productsPanel" hidden>
      <div class="panel-head">
        <h2 id="productsTitle">Products</h2>
        <button id="backToCollectionsBtn" class="link-btn">← Back to collections</button>
      </div>

      <form id="productForm" class="quick-form">
        <h3>Quick add product</h3>
        <input type="text" id="pName" placeholder="Product name" required>
        <textarea id="pDescription" placeholder="Description (optional)" rows="2"></textarea>
        <div class="form-row">
          <input type="number" id="pPrice" placeholder="Price (e.g. 129.90)" step="0.01" min="0" required>
          <select id="pCurrency">
            <option value="eur">EUR €</option>
            <option value="usd">USD $</option>
            <option value="ils">ILS ₪</option>
            <option value="gbp">GBP £</option>
          </select>
        </div>
        <input type="file" id="pImages" accept="image/*" multiple capture="environment">
        <div id="pImagePreview" class="image-preview"></div>
        <button type="submit" class="btn-primary" id="pSubmitBtn">Add product</button>
        <div id="productFormStatus" class="status-text"></div>
      </form>

      <div id="productsTable"></div>
    </section>
  </main>
</div>

<script src="js/admin.js"></script>
</body>
</html>
