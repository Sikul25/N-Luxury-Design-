<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ניהול | N Luxury Design</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="loginView" class="login-screen">
  <div class="login-card">
    <h1>N Luxury Design</h1>
    <p>כניסה לפאנל הניהול</p>
    <input type="password" id="loginPassword" placeholder="סיסמה" autocomplete="current-password">
    <button id="loginBtn" class="btn-primary">כניסה</button>
    <div id="loginError" class="error-text"></div>
  </div>
</div>

<div id="appView" class="admin-app" hidden>
  <header class="admin-header">
    <div class="admin-header-inner">
      <span class="admin-brand">N Luxury Design · ניהול</span>
      <div class="admin-header-actions">
        <a href="index.html" target="_blank" class="link-btn">צפייה בחנות ↗</a>
        <button id="logoutBtn" class="link-btn">יציאה</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <section class="panel">
      <div class="panel-head">
        <h2>קולקציות</h2>
      </div>

      <form id="collectionForm" class="quick-form">
        <h3>קולקציה חדשה</h3>
        <input type="text" id="cName" placeholder="שם הקולקציה (למשל: אביב-קיץ 2026)" required>
        <input type="text" id="cSeason" placeholder="עונה (לא חובה, למשל: SS26)">
        <textarea id="cDescription" placeholder="תיאור קצר (לא חובה)" rows="2"></textarea>
        <button type="submit" class="btn-primary">הוספת קולקציה</button>
        <div id="collectionFormStatus" class="status-text"></div>
      </form>

      <div id="collectionsTable"></div>
    </section>

    <section class="panel" id="productsPanel" hidden>
      <div class="panel-head">
        <h2 id="productsTitle">מוצרים</h2>
        <button id="backToCollectionsBtn" class="link-btn">← חזרה לקולקציות</button>
      </div>

      <form id="productForm" class="quick-form">
        <h3>הוספת מוצר מהירה</h3>
        <input type="text" id="pName" placeholder="שם המוצר" required>
        <textarea id="pDescription" placeholder="תיאור (לא חובה)" rows="2"></textarea>
        <div class="form-row">
          <input type="number" id="pPrice" placeholder="מחיר (למשל 129.90)" step="0.01" min="0" required>
          <select id="pCurrency">
            <option value="eur">EUR €</option>
            <option value="usd">USD $</option>
            <option value="ils">ILS ₪</option>
            <option value="gbp">GBP £</option>
          </select>
        </div>
        <input type="file" id="pImages" accept="image/*" multiple capture="environment">
        <div id="pImagePreview" class="image-preview"></div>
        <button type="submit" class="btn-primary" id="pSubmitBtn">הוספת מוצר</button>
        <div id="productFormStatus" class="status-text"></div>
      </form>

      <div id="productsTable"></div>
    </section>
  </main>
</div>

<script src="js/admin.js"></script>
</body>
</html>
