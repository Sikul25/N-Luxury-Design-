<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Burlesque Atelier — handcrafted clothing and jewelry collections.">
  <title>Burlesque Atelier</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="seal" viewBox="0 0 66 160">
    <path d="M12,0 Q56,2 58,32 Q60,58 20,78 Q66,104 64,128 Q60,156 18,160 L0,160 Z" fill="#e0392f"/>
  </symbol>
</svg>

<header class="site-header">
  <div class="header-inner">
    <a href="#" class="brand">
      <svg class="brand-seal"><use href="#seal"/></svg>
      <span class="brand-word"><span>BUR</span><span>LES</span><span>QUE<sup class="tm">TM</sup></span><small>ATELIER</small></span>
    </a>
    <div class="header-actions">
      <select class="lang-select" id="langSelect" aria-label="Language"></select>
      <button class="cart-btn" id="cartOpenBtn" data-i18n="nav.cart">Cart <span class="cart-count" id="cartCount">0</span></button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <svg class="hero-seal"><use href="#seal"/></svg>
    <h1 data-i18n="hero.title">Handcrafted elegance,<br>season after season.</h1>
    <p data-i18n="hero.subtitle">Discover the latest collection — clothing and jewelry designed and photographed by hand.</p>
    <button class="btn-primary" id="heroCta" data-i18n="hero.cta">Explore the collection</button>
  </section>

  <section class="section container" id="collections">
    <h2 class="section-title" data-i18n="collections.title">Collections</h2>
    <div class="collections-nav" id="collectionsNav"></div>
    <div id="collectionsList"></div>
  </section>
</main>

<footer class="site-footer">
  <span class="brand" style="justify-content:center">
    <svg class="brand-seal"><use href="#seal"/></svg>
    <span class="brand-word"><span>BUR</span><span>LES</span><span>QUE<sup class="tm">TM</sup></span><small>ATELIER</small></span>
  </span>
  <p data-i18n="footer.tagline">Timeless pieces, made with care.</p>
  <p>&copy; <span id="year"></span> Burlesque Atelier — <span data-i18n="footer.rights">All rights reserved.</span></p>
</footer>

<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
  <div class="cart-head">
    <h3 data-i18n="cart.title">Your cart</h3>
    <button class="icon-btn" id="cartCloseBtn" aria-label="Close">&times;</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot" id="cartFoot"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
</body>
</html>
